<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beatzo - Login</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="login-background">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
    </div>


    <main class="login-container">

        <!-- Left Side -->
        <section class="login-showcase">

            <a href="index.html" class="brand">
                <span class="brand-icon">
                    <i class="fa-solid fa-headphones"></i>
                </span>

                <span>Beatzo</span>
            </a>

            <div class="showcase-content">

                <div class="disc">
                    <i class="fa-solid fa-music"></i>
                </div>

                <h1>
                    Your music.
                    <br>
                    Your mood.
                </h1>

                <p>
                    Discover new sounds, create playlists,
                    and enjoy your favorite music with Beatzo.
                </p>

            </div>

        </section>


        <!-- Login Card -->
        <section class="login-section">

            <div class="login-card">

                <div class="mobile-logo">
                    <i class="fa-solid fa-headphones"></i>
                    <span>Beatzo</span>
                </div>

                <div class="login-heading">

                    <span class="welcome">WELCOME BACK</span>

                    <h2>Sign in to Beatzo</h2>

                    <p>
                        Continue listening to your favorite music.
                    </p>

                </div>
              <form id="loginForm">

                    <div class="social-login">

    <button type="button" id="googleLogin" class="social-btn google-btn">
        <i class="fa-brands fa-google"></i>
        Continue with Google
    </button>

    <button type="button" id="phoneLogin" class="social-btn phone-btn">
        <i class="fa-solid fa-phone"></i>
        Continue with Phone Number
    </button>

</div>

<div class="divider">
    <span>OR</span>
</div>

                    <!-- Email -->
                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->
                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword">

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <!-- Options -->
                    <div class="login-options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="remember">

                            <span>Remember me</span>

                        </label>

                        <a href="#" id="forgotPassword">
                            Forgot password?
                        </a>

                    </div>


                    <!-- Error -->
                    <p class="login-message" id="loginMessage"></p>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="login-btn">

                        <span>Sign In</span>

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>


                <div class="divider">
                    <span>OR</span>
                </div>


                <!-- Guest -->
                <button
                    class="guest-btn"
                    id="guestBtn">

                    <i class="fa-solid fa-user"></i>

                    Continue as Guest

                </button>


                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Create account
                    </a>

                </p>


                <p class="back-home">
                    <a href="index.html">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back to Beatzo
                    </a>
                </p>

            </div>

        </section>

    </main>

     <script type="module" src="login.js"></script>
</body>

</html>
